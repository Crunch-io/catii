name: Publish catii

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy Cython pytest
      - name: Install catii
        run: pip install -e .
      - name: Run tests
        run: python -m pytest tests/ -v

  pypi:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine build
      - name: Build sdist and wheel
        run: python -m build
      - name: Publish sdist to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_APIKEY }}
        run: twine upload --skip-existing dist/*.tar.gz
      - name: Publish wheel to Nexus unstable
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          twine upload \
            --repository-url "https://ui.nexus.crint.net/repository/unstable/" \
            -u "$NEXUS_USER" -p "$NEXUS_PASSWORD" \
            dist/*.whl
