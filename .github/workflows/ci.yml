name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install --upgrade pip
          pip install numpy Cython pytest
          pip install -e .
      - name: Test
        run: pytest tests/ -q

  test-numpy1:
    # Exercise the numpy 1.x line explicitly. The matrix job above runs
    # `pip install numpy`, which resolves to the latest (2.x), so nothing
    # otherwise tests catii against numpy 1.x — the version production runs
    # (1.23.5) and the lower end of setup.py's `numpy>=1.15.2` range.
    # Does not change catii's declared deps — it just pins numpy<2 for the run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (numpy 1.x)
        run: |
          pip install --upgrade pip
          pip install "numpy<2" Cython pytest
          pip install -e .
      - name: Test
        run: pytest tests/ -q
