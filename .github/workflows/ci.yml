name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        # catii supports both numpy lines (setup.py: numpy>=1.15.2), so exercise
        # both across Pythons. Values are self-describing so the job name reads
        # e.g. "test (3.11, numpy2)".
        numpy: ["numpy1", "numpy2"]
        exclude:
          # numpy 1.x has no wheels for Python 3.14 (1.x predates 3.14 support),
          # so this combination cannot be installed.
          - python-version: "3.14"
            numpy: "numpy1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (${{ matrix.numpy }})
        run: |
          pip install --upgrade pip
          if [ "${{ matrix.numpy }}" = "numpy1" ]; then
            pip install "numpy<2" Cython pytest
          else
            pip install "numpy>=2" Cython pytest
          fi
          pip install -e .
      - name: Test
        run: pytest tests/ -q
