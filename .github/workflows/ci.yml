name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: test (py${{ matrix.python-version }}, numpy${{ matrix.numpy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        # catii supports both numpy lines (setup.py: numpy>=1.15.2), so exercise
        # both across Pythons. See the job `name:` above for readable output.
        numpy: ["1", "2"]
        exclude:
          # numpy 1.x has no wheels for Python 3.14 (1.x predates 3.14 support),
          # so this combination cannot be installed.
          - python-version: "3.14"
            numpy: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (numpy ${{ matrix.numpy }}.x)
        run: |
          pip install --upgrade pip
          pip install "numpy>=${{ matrix.numpy }},<$(( ${{ matrix.numpy }} + 1 ))" Cython pytest
          pip install -e .
      - name: Test
        run: pytest tests/ -q
